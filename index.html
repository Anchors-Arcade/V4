<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gammal sida</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top left, #1e3a8a 0%, transparent 35%),
                radial-gradient(circle at bottom right, #111827 0%, #030712 60%);
            overflow: hidden;
        }

        /* Bakgrunds-glow */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #2563eb;
            filter: blur(180px);
            opacity: 0.15;
            border-radius: 50%;
            animation: float 6s ease-in-out infinite alternate;
        }

        @keyframes float {
            from {
                transform: translate(-100px, -50px);
            }
            to {
                transform: translate(100px, 50px);
            }
        }

        .container {
            position: relative;
            width: min(90%, 650px);
            padding: 50px 40px;
            text-align: center;

            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5),
                0 0 50px rgba(37, 99, 235, 0.12);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            animation: appear 0.7s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(96, 165, 250, 0.5));
        }

        h1 {
            font-size: clamp(28px, 5vw, 42px);
            margin-bottom: 18px;
            font-weight: 800;

            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .old {
            display: inline-block;
            padding: 7px 14px;
            margin-bottom: 22px;

            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 999px;

            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 15px 28px;
            border-radius: 14px;

            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;

            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.45);
            filter: brightness(1.1);
        }

        .button:active {
            transform: translateY(0);
        }

        .arrow {
            font-size: 20px;
            transition: transform 0.2s ease;
        }

        .button:hover .arrow {
            transform: translateX(4px);
        }

        .footer {
            margin-top: 28px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 40px 25px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">⚠️</div>

        <span class="old">GAMMAL VERSION</span>

        <h1>Denna sidan är gammal</h1>

        <p>
            Den här sidan fungerar inte längre och kommer inte att uppdateras.
            <br>
            Vi har flyttat till en ny version!
        </p>

        <a
            class="button"
            href="https://anchors-arcade.github.io/XXX/"
        >
            Gå till nya sidan
            <span class="arrow">→</span>
        </a>

        <div class="footer">
            Tack för att du använder Anchor's Arcade ❤️
        </div>

    </main>

</body>
</html>
